<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WoW Armory — Character Dashboard</title>
<link rel="icon" type="image/png" href="assets/icons/inv_misc_rune_01.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14171c">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__title">
      <h1><img class="app-header__icon" src="assets/icons/inv_misc_rune_01.png" alt="">WoW Armory</h1>
      <p class="app-header__subtitle">Character Dashboard</p>
    </div>
  </header>

  <main id="app-root">
    <section id="empty-state" class="empty-state">
      <p>No data loaded yet.</p>
      <p>Waiting on characters.json from the repo — or load a file manually below.</p>
    </section>

    <section id="summary-bar" class="summary-bar" hidden></section>

    <section id="factions" class="factions" hidden></section>
  </main>

  <footer class="app-footer">
    <p>Character data is fetched from this repo's characters.json and rendered entirely in your browser.</p>
    <label class="file-picker-fallback" for="file-input">Load characters.json manually</label>
    <input type="file" id="file-input" accept="application/json,.json" hidden>
  </footer>

<script src="app.js"></script>
</body>
</html>
